$schema: https://airflow.apache.org/schemas/dag/2026-10-30.json
dag_id: yaml_etl_python
tags: [multilang]

templates:
  python:
    uses: include.yaml_operators.ImportStringPythonOperator

tasks:
  - id: extract
    extends: [python]
    with:
      python_callable: include.etl.extract

  - id: transform
    extends: [python]
    with:
      python_callable: include.etl.transform
      op_kwargs:
        data: {$x: extract}

  - id: load
    extends: [python]
    with:
      python_callable: include.etl.load
      op_kwargs:
        total: {$x: transform}

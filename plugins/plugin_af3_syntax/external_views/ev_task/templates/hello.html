<!DOCTYPE html>
<html>

<head>
    <title>Hello World - Task</title>
    <link rel="stylesheet" type="text/css" href="/ev-task-plugin/static/style.css">
</head>

<body>
    <div class="container">
        <h1>Hello Friend! 😊</h1>
        <p>This is an example for a task external view plugin. The page is accessible from individual task pages.</p>
        
        <div class="task-info">
            <div class="info-item">
                <span class="label">DAG ID:</span>
                <span class="value" id="dagId">{{DAG_ID}}</span>
            </div>
            <div class="info-item">
                <span class="label">Task ID:</span>
                <span class="value" id="taskId">{{TASK_ID}}</span>
            </div>
            <div class="info-item">
                <span class="label">Type:</span>
                <span class="value">Task Definition</span>
            </div>
        </div>
        
        <button class="btn" id="helloButton">
            Hello Airflow!
        </button>
    </div>

    <script src="/ev-task-plugin/static/script.js"></script>
</body>

</html>
